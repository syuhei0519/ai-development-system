name: Validate handoff contracts
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: All contracts, bounded delivery capacity/retry and collector crash regressions
        run: python -m unittest discover -s tests -v
      - name: Delivery schema and pinned sample consistency
        run: python scripts/validate_delivery_records.py
      - run: >-
          python scripts/validate_handoff.py
          examples/research-to-test/research.handoff.json
          examples/research-to-test/test.blocked.handoff.json
          examples/research-to-test/test.handoff.json
          examples/failed.handoff.json
          examples/partial-assignment.handoff.json
      - run: >-
          python scripts/validate_knowledge.py
          examples/knowledge/input.json
          examples/knowledge/handoff.json
          examples/knowledge/context.json
          examples/knowledge-delivery/input.json
          examples/knowledge-delivery/handoff.json
          examples/knowledge-delivery/context.json
      - run: >-
          python scripts/validate_readiness.py
          examples/readiness/pr-ready-issue-unverified.json
          --context examples/readiness/context.json
          --handoff examples/readiness/manager.handoff.json
          --at 2030-01-01T12:00:00Z
      - run: >-
          python scripts/validate_readiness.py
          examples/readiness/implementation-only.json
          --context examples/readiness/automatic-context.json
          --at 2030-01-01T12:00:00Z
      - run: >-
          python scripts/validate_readiness.py
          examples/readiness/postdeploy-achieved.json
          --context examples/readiness/context.json
          --at 2030-01-01T12:00:00Z
      - name: Aggregate synthetic-achieved replay
        run: >-
          python scripts/validate_issue_completion.py examples/issue-completion/synthetic-achieved/completion.json --context examples/issue-completion/synthetic-achieved/context.json --context-sha256 951048815ca07294e13e6df297272e719e121d81a8e1c523c3958e4ba97742ac --handoff examples/issue-completion/synthetic-achieved/handoff.json --at 2030-01-03T12:00:00Z
      - name: Aggregate synthetic-pending replay
        run: >-
          python scripts/validate_issue_completion.py examples/issue-completion/synthetic-pending/completion.json --context examples/issue-completion/synthetic-pending/context.json --context-sha256 8943ce6030f4335adb8cfab5f7338670b2c45b3d24bd3114e92fab5c1cd8d5ff --handoff examples/issue-completion/synthetic-pending/handoff.json --at 2030-01-03T12:00:00Z
