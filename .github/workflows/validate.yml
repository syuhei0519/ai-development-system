name: Validate handoff contracts
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Routing tests verify the pinned artifact ancestor, not a floating file.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Jira migration mapping consistency (offline, read-only)
        run: python scripts/jira_tracker.py --check-mapping
      - name: Markdown Handoff structure
        run: python scripts/validate_handoff.py templates/handoff.md
      - name: Legacy compatibility and safety regressions
        run: python -m unittest discover -s tests -v
      - name: Delivery schema and pinned sample consistency
        run: python scripts/validate_delivery_records.py
      - run: >-
          python scripts/validate_handoff.py
          examples/research-to-test/research.handoff.json
          examples/research-to-test/test.blocked.handoff.json
          examples/research-to-test/test.handoff.json
          examples/failed.handoff.json
          examples/partial-assignment.handoff.json
      - run: >-
          python scripts/validate_knowledge.py
          examples/knowledge/input.json
          examples/knowledge/handoff.json
          examples/knowledge/context.json
          examples/knowledge-delivery/input.json
          examples/knowledge-delivery/handoff.json
          examples/knowledge-delivery/context.json
      - run: >-
          python scripts/validate_readiness.py
          examples/readiness/pr-ready-issue-unverified.json
          --context examples/readiness/context.json
          --context-sha256 d7efd0d4948048eccf854820fecf72ad0a49a0c50f6b9b4dc733d3c062b50357
          --handoff examples/readiness/manager.handoff.json
          --at 2030-01-01T12:00:00Z
      - run: >-
          python scripts/validate_readiness.py
          examples/readiness/implementation-only.json
          --context examples/readiness/automatic-context.json
          --context-sha256 8be3c32390350c0962ad60b90dfe773baf1fcf742841e46d6c6f8943ee5e13d9
          --at 2030-01-01T12:00:00Z
      - run: >-
          python scripts/validate_readiness.py
          examples/readiness/postdeploy-achieved.json
          --context examples/readiness/context.json
          --context-sha256 d7efd0d4948048eccf854820fecf72ad0a49a0c50f6b9b4dc733d3c062b50357
          --at 2030-01-01T12:00:00Z
  # platform-lab プラグインの hook の試験（PLAT-235）。ruleset の必須チェックはこのジョブ名。
  plugin-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -x plugins/platform-lab/hooks/*.sh plugins/platform-lab/hooks/tests/run.sh
      - name: manifest JSON
        run: jq -e . .claude-plugin/marketplace.json plugins/platform-lab/.claude-plugin/plugin.json plugins/platform-lab/hooks/hooks.json templates/settings.json.tmpl .claude/settings.json >/dev/null
      - name: hook tests
        run: bash plugins/platform-lab/hooks/tests/run.sh
      # プラグインを変えて version が同じだと、claude plugin update が古いキャッシュを使い続ける。
      - name: plugin version bumped
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE_REF"
          git diff --quiet FETCH_HEAD -- plugins/platform-lab && exit 0
          base="$(git show FETCH_HEAD:plugins/platform-lab/.claude-plugin/plugin.json | jq -r .version)"
          head="$(jq -r .version plugins/platform-lab/.claude-plugin/plugin.json)"
          if [ "$base" = "$head" ]; then
            echo "::error::plugins/platform-lab を変えたら plugin.json の version を上げてください（現在 $head）"
            exit 1
          fi
