name: Claude Review
# 全 PR に AI レビューの記録を残す（PLAT-257）。必要な Secret: CLAUDE_CODE_OAUTH_TOKEN
# 認証の既定経路は Claude GitHub App（https://github.com/apps/claude）の導入と id-token: write が前提。
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    # フォーク PR（Secret も OIDC も使えない）、依存更新ブランチ、draft は対象外
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.event.pull_request.head.ref, 'chore/bump-')
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: --allowedTools "mcp__github_inline_comment__create_inline_comment"
