---
apiVersion: v1
kind: Service
metadata:
  name: order-postgresql
  labels:
    app.kubernetes.io/name: order-postgresql
    app.kubernetes.io/instance: order-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: order
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-postgresql
    app.kubernetes.io/instance: order-postgresql
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-postgresql
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
  labels:
    app.kubernetes.io/name: order-postgresql
    app.kubernetes.io/instance: order-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: order
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: order-postgresql-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: order-postgresql
      app.kubernetes.io/instance: order-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-postgresql
        app.kubernetes.io/instance: order-postgresql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: order
        app.kubernetes.io/managed-by: Helm
      annotations:
        checksum/init: 2b7d6d2c3f776415775bef102fdff547dd233e8a7994209a23a8d13cc9534ea0
    spec:
      serviceAccountName: order-postgresql
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: order-postgresql
        image: docker.io/library/postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - 'umask 077

          printf ''%s:%s:%s:%s:%s\n'' ''*'' ''*'' ''orders'' "$(cat /run/order-db/app-username)"
          "$(cat /run/order-db/app-password)" > /tmp/pgpass

          exec docker-entrypoint.sh postgres -c max_connections=30 -c shared_buffers=128MB

          '
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: postgres
        - name: POSTGRES_PASSWORD_FILE
          value: /run/order-db/admin-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: PGPASSFILE
          value: /tmp/pgpass
        ports:
        - name: postgresql
          containerPort: 5432
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        - name: order-db
          mountPath: /run/order-db
          readOnly: true
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - pg_isready -U postgres -d postgres
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - pg_isready -U postgres -d postgres
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - PGUSER=$(cat /run/order-db/app-username) psql -h $POD_IP -d orders -tAc
              'SELECT 1' | grep -qx 1
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: order-postgresql-data
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: init
        configMap:
          name: order-postgresql-init
          defaultMode: 365
      - name: order-db
        secret:
          secretName: order-db
          defaultMode: 288
