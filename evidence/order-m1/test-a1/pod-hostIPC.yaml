    app.kubernetes.io/instance: order-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: order
    app.kubernetes.io/managed-by: Helm
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
