---
# Source: postgresql/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: account
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: postgresql-headless
  replicas: 1
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: postgresql}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: postgresql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: account
        app.kubernetes.io/managed-by: Helm
      annotations:
        checksum/init: b582bda37fa89c7c7b3d262547bd0ff96264bc1501fd8ee4f85c0f601700debf
    spec:
      serviceAccountName: postgresql
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: 
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: "docker.io/library/postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              printf '%s:%s:%s:%s:%s\n' '*' '*' 'account' "$(cat /run/account-db/app-username)" "$(cat /run/account-db/app-password)" > /tmp/pgpass
              exec docker-entrypoint.sh postgres -c max_connections=30 -c shared_buffers=128MB
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: postgres}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/account-db/admin-password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: PGPASSFILE, value: /tmp/pgpass}
          ports: [{name: postgresql, containerPort: 5432}]
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources: 
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: account-db, mountPath: /run/account-db, readOnly: true}
          startupProbe:
            exec: {command: ["/bin/sh", "-ec", "pg_isready -U postgres -d postgres"]}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec: {command: ["/bin/sh", "-ec", "pg_isready -U postgres -d postgres"]}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "PGUSER=$(cat /run/account-db/app-username) psql -h $POD_IP -d account -tAc 'SELECT 1' | grep -qx 1"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: postgresql-data}}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - {name: init, configMap: {name: postgresql-init, defaultMode: 365}}
        - name: account-db
          secret: {secretName: account-db, defaultMode: 288}
