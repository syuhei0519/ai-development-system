---
# Source: postgresql/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: account
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: false

---
# Source: postgresql/templates/init-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: account
    app.kubernetes.io/managed-by: Helm
data:
  10-account.sh: |
    #!/bin/sh
    set -eu
    app_user="$(cat /run/account-db/app-username)"
    app_password="$(cat /run/account-db/app-password)"
    psql --set=ON_ERROR_STOP=1 --set=app_user="$app_user" --set=app_password="$app_password" --set=db_name="account" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD %L', :'app_user', :'app_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'app_user') \gexec
    SELECT format('CREATE DATABASE %I OWNER %I', :'db_name', :'app_user')
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db_name') \gexec
    SQL

---
# Source: postgresql/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: account
    app.kubernetes.io/managed-by: Helm
spec:
  accessModes: 
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests: {storage: 2Gi}

